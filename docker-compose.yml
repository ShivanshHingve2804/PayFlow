services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
      POSTGRES_DB: payflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.5
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:29092,external://localhost:9092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --smp
      - "1"
      - --memory
      - 512M
      - --mode
      - dev-container
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://payflow:payflow@db:5432/payflow
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
    restart: unless-stopped

  outbox-relay:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://payflow:payflow@db:5432/payflow
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
    command: ["python", "-m", "app.streaming.kafka_worker", "relay"]
    restart: unless-stopped

  audit-consumer:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://payflow:payflow@db:5432/payflow
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
    command: ["python", "-m", "app.streaming.kafka_worker", "consumer"]
    restart: unless-stopped

  airflow:
    image: apache/airflow:2.10.4-python3.12
    profiles: ["airflow"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DATABASE_URL: postgresql://payflow:payflow@db:5432/payflow
      PYTHONPATH: /opt/airflow/payflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./app:/opt/airflow/payflow/app
    command: standalone

volumes:
  pgdata:
